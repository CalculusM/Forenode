# Forenode 테마 — 라이트: 기관 네이비 / 다크: 그래파이트 틸 ('26-07 디자인 개편)
# 라이트·다크는 사용자 브라우저/앱 설정을 따라 자동 전환되며,
# 앱 내부 CSS·차트 색은 ui_theme.py가 st.context.theme으로 동기화한다.

[theme]
base = "light"
primaryColor = "#1E3A5F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"

[theme.dark]
primaryColor = "#2DD4BF"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
