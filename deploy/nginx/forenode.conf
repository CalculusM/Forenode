# ------------------------------------------------------------------
# Forenode nginx 사이트 설정 예시 (Ubuntu/Debian nginx 기준, 2026-09-28 작성)
#
# 설치 위치
#   sudo cp deploy/nginx/forenode.conf /etc/nginx/sites-available/forenode
#   sudo ln -s /etc/nginx/sites-available/forenode /etc/nginx/sites-enabled/forenode
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 치환 항목: app.example.kr  (대표가 확보한 도메인으로 교체, 2곳)
#
# 전제: 앱이 127.0.0.1:8501 에서 대기 (compose 포트 게시 또는 systemd --server.address 127.0.0.1)
#
# HTTPS (certbot, 대표 실행: 약관 동의·이메일 입력 단계 포함)
#   1) DNS A 레코드: app.example.kr = 서버 공인 IP, 전파 확인(dig +short app.example.kr)
#   2) sudo apt install -y certbot python3-certbot-nginx
#   3) sudo certbot --nginx -d app.example.kr --redirect
#        certbot 이 아래 server 블록에 listen 443 ssl·인증서 경로를 추가하고 80 요청을 443 으로 전환
#   4) 자동 갱신 확인: systemctl list-timers | grep certbot ; sudo certbot renew --dry-run
#   5) HTTPS 정상 확인 후 아래 HSTS 줄 주석 해제, sudo nginx -t && sudo systemctl reload nginx
# ------------------------------------------------------------------

# 웹소켓 업그레이드 헤더 매핑 (Streamlit 은 /_stcore/stream 웹소켓 필수)
# sites-enabled 파일은 nginx.conf 의 http 블록 안에서 include 되므로 map 선언 가능
# 같은 서버에 다른 사이트가 이미 $connection_upgrade 를 선언했다면 이 map 블록 삭제(중복 선언 오류 방지)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream forenode_app {
    server 127.0.0.1:8501;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.kr;

    server_tokens off;

    # 파일 업로드 상한 = Streamlit server.maxUploadSize 기본 200MB 와 일치 (IFC 업로드)
    client_max_body_size 200m;

    # 보안 헤더 (Streamlit 은 인라인 스크립트 사용 = CSP 는 미적용)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000" always;   # HTTPS 확인 후 해제

    # 헬스체크: 접근 로그 제외
    location = /_stcore/health {
        proxy_pass http://forenode_app;
        access_log off;
    }

    location / {
        proxy_pass http://forenode_app;

        # 웹소켓 프록시 필수 헤더 (누락 시 화면이 "Connecting..." 에서 정지)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 원 요청 정보 전달 (XSRF 쿠키·오리진 검사가 같은 호스트로 인식되도록)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 장시간 세션 유지 (기본 60초면 유휴 웹소켓이 끊김)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # 스트리밍 응답 즉시 전달
        proxy_buffering off;
    }
}
